<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <!-- Rich Cinematic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="25%" stop-color="#FFB300" />
      <stop offset="65%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#80D8FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <linearGradient id="crestDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1610" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0D0906" stop-opacity="0.98" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Emblem Shield / Wings -->
  <g filter="url(#badgeShadow)">
    <!-- Shield Plate -->
    <polygon points="40,24 500,24 470,116 270,132 70,116" fill="url(#crestDark)" stroke="#D97706" stroke-width="2" stroke-opacity="0.6" />
    <polygon points="56,32 484,32 458,108 270,122 82,108" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Left & Right Tactical Chevrons -->
    <path d="M 24 58 L 44 40 L 44 80 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 516 58 L 496 40 L 496 80 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Center Top Crown Accent -->
    <polygon points="255,14 270,4 285,14 270,20" fill="url(#cyanGrad)" />
    <circle cx="270" cy="18" r="3" fill="#FFFFFF" filter="url(#goldGlow)" />
  </g>

  <!-- Typography -->
  <!-- "COMPLEX" - Heavy Tech Display -->
  <text x="270" y="70" 
        font-family="'Inter', 'Montserrat', 'Impact', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="9" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        filter="url(#goldGlow)">COMPLEX</text>

  <!-- "RUNNER" - Glowing Cyan Cyber Subtitle -->
  <text x="270" y="102" 
        font-family="'Inter', 'Orbitron', 'Segoe UI', sans-serif" 
        font-size="18" 
        font-weight="800" 
        letter-spacing="14" 
        fill="url(#cyanGrad)" 
        text-anchor="middle">RUNNER</text>

  <!-- Accent Lines -->
  <line x1="120" y1="112" x2="230" y2="112" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <circle cx="270" cy="112" r="3.5" fill="url(#cyanGrad)" />
  <line x1="310" y1="112" x2="420" y2="112" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7" />
</svg>
