<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D17E" />
      <stop offset="35%" stop-color="#C99338" />
      <stop offset="75%" stop-color="#8F5E16" />
      <stop offset="100%" stop-color="#472A04" />
    </linearGradient>
    <linearGradient id="logoSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2B8A3" />
      <stop offset="50%" stop-color="#EDE7DA" />
      <stop offset="100%" stop-color="#A19680" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background Shield Crest -->
  <polygon points="20,20 480,20 455,100 45,100" fill="#0D0914" stroke="#5E4314" stroke-width="1.5" />
  <line x1="35" y1="26" x2="465" y2="26" stroke="url(#logoGold)" stroke-width="1" opacity="0.6" />
  <line x1="55" y1="94" x2="445" y2="94" stroke="url(#logoGold)" stroke-width="1" opacity="0.6" />

  <!-- Title: PRABHAS -->
  <text x="250" y="63" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="38" font-weight="900" letter-spacing="8" fill="url(#logoGold)" text-anchor="middle" filter="url(#logoShadow)">PRABHAS</text>

  <!-- Subtitle: REALMS OF RUN -->
  <text x="250" y="87" font-family="'Orbitron', 'Montserrat', 'Impact', sans-serif" font-size="13" font-weight="800" letter-spacing="9" fill="url(#logoSilver)" text-anchor="middle">REALMS OF RUN</text>

  <!-- Side Trim Chevrons -->
  <polygon points="50,60 32,60 41,70" fill="url(#logoGold)" />
  <polygon points="450,60 468,60 459,70" fill="url(#logoGold)" />
</svg>
