<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Lightning Purple-Cyan Energy Gradient -->
    <linearGradient id="harpoonShaftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="40%" stop-color="#A855F7" />
      <stop offset="80%" stop-color="#7E22CE" />
      <stop offset="100%" stop-color="#3B0764" />
    </linearGradient>

    <linearGradient id="harpoonEnergyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#00E5FF" />
      <stop offset="80%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <radialGradient id="harpoonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Energy Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#harpoonAura)" />

  <!-- Background EMP Shock Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 3" opacity="0.6" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#A855F7" stroke-width="1.2" opacity="0.4" />

  <!-- Harpoon Spear Shaft (Angled 45 deg) -->
  <line x1="16" y1="48" x2="44" y2="20" stroke="url(#harpoonShaftGrad)" stroke-width="4" stroke-linecap="round" />
  <line x1="18" y1="46" x2="42" y2="22" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.8" />

  <!-- Spear Head Blades -->
  <polygon points="44,20 48,12 52,16 44,20" fill="url(#harpoonEnergyGrad)" stroke="#FFFFFF" stroke-width="0.8" />
  <polygon points="40,24 48,12 44,20" fill="#00E5FF" />
  <polygon points="44,20 52,16 48,28" fill="#A855F7" />

  <!-- EMP Arc Tendrils -->
  <path d="M 46,14 Q 52,20 56,18 Q 50,26 48,24" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 38,26 Q 34,22 30,24 Q 32,30 36,32" fill="none" stroke="#E9D5FF" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="48" cy="14" r="2.5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="2" fill="#00E5FF" />
</svg>
