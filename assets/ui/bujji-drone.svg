<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50" width="80" height="50">
  <defs>
    <!-- Bujji Metallic Yellow & Carbon Gradient -->
    <linearGradient id="bujjiBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE07D" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bujjiDarkArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <radialGradient id="bujjiEyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#00D2D9" />
      <stop offset="100%" stop-color="#0891B2" />
    </radialGradient>
    <radialGradient id="bujjiThruster" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#006064" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left/Right Cyan Plasma Thrusters -->
  <ellipse cx="14" cy="25" rx="10" ry="6" fill="url(#bujjiThruster)" />
  <ellipse cx="66" cy="25" rx="10" ry="6" fill="url(#bujjiThruster)" />

  <!-- Bujji Aerodynamic Main Chassis -->
  <path d="M 22 25 L 30 10 L 50 10 L 58 25 L 50 40 L 30 40 Z" fill="url(#bujjiBody)" stroke="#78350F" stroke-width="1.8" />
  
  <!-- Carbon Fiber Wing Pods -->
  <polygon points="12,25 24,16 24,34" fill="url(#bujjiDarkArmor)" stroke="#F59E0B" stroke-width="1.2" />
  <polygon points="68,25 56,16 56,34" fill="url(#bujjiDarkArmor)" stroke="#F59E0B" stroke-width="1.2" />

  <!-- Animated Holographic Robotic Eye -->
  <circle cx="40" cy="24" r="9" fill="url(#bujjiDarkArmor)" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="40" cy="24" r="6" fill="url(#bujjiEyeGlow)" />
  <circle cx="42" cy="22" r="2" fill="#FFFFFF" />

  <!-- Front Laser Cannon Emitter -->
  <rect x="38" y="38" width="4" height="6" rx="1" fill="#00D2D9" />
</svg>
