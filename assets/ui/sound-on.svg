<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Clean Sci-Fi Audio On Icon with Amber Glow -->
  <defs>
    <filter id="soundOnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#F59E0B" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Speaker Body -->
  <polygon points="7,15 13,15 20,9 20,31 13,25 7,25" fill="#FFFDF8" filter="url(#soundOnGlow)" />
  <!-- Sound Arc 1 -->
  <path d="M 24 14 Q 28 20 24 26" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <!-- Sound Arc 2 -->
  <path d="M 28 10 Q 34 20 28 30" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" fill="none" />
</svg>
