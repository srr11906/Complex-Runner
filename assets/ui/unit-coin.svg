<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 3D Gold Rim Gradient -->
    <linearGradient id="coinOuterRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="85%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 3D Bevel Highlight -->
    <linearGradient id="coinBevelTop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1" />
    </linearGradient>

    <!-- Inner Face Gradient -->
    <radialGradient id="coinInnerFace" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- 3D Cyan Tech Core -->
    <linearGradient id="coinCyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Drop Shadow / Glow -->
    <radialGradient id="coinAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="31" fill="url(#coinAmbientGlow)" />

  <!-- Outer 3D Rim Base -->
  <circle cx="32" cy="33" r="27" fill="#451A03" />
  <circle cx="32" cy="32" r="27" fill="url(#coinOuterRim)" stroke="#92400E" stroke-width="1" />

  <!-- Specular Top Rim Lip -->
  <path d="M 10 30 A 22 22 0 0 1 54 30 A 22 21 0 0 0 10 30 Z" fill="url(#coinBevelTop)" />

  <!-- Inner Stepped Cavity -->
  <circle cx="32" cy="32" r="22" fill="#78350F" />
  <circle cx="32" cy="32" r="20.5" fill="url(#coinInnerFace)" stroke="#FDE68A" stroke-width="1.2" />

  <!-- Concentric Tech Grooves -->
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#FDE047" stroke-width="0.8" stroke-dasharray="3 1.5" opacity="0.75" />

  <!-- 3D Faceted Diamond / Quantum Unit Crest -->
  <polygon points="32,18 41,32 32,46 23,32" fill="#075985" />
  <!-- Left Facet -->
  <polygon points="32,18 23,32 32,32" fill="#38BDF8" />
  <!-- Right Facet -->
  <polygon points="32,18 41,32 32,32" fill="#E0F2FE" />
  <!-- Bottom Left Facet -->
  <polygon points="23,32 32,46 32,32" fill="#0284C7" />
  <!-- Bottom Right Facet -->
  <polygon points="41,32 32,46 32,32" fill="#0369A1" />

  <!-- Center Core Glimmer -->
  <polygon points="32,27 35,32 32,37 29,32" fill="#FFFFFF" opacity="0.9" />
</svg>
