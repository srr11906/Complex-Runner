<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Radiant 3D Pure Gold Rim Gradient -->
    <linearGradient id="coinOuterRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 3D Bevel Top Specular Highlight -->
    <linearGradient id="coinBevelTop" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.1" />
    </linearGradient>

    <!-- Vivid Golden Inner Face Gradient -->
    <radialGradient id="coinInnerFace" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="65%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </radialGradient>

    <!-- Glowing Electric Cyan Solid Triangle -->
    <linearGradient id="neonCyanTri" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFF" />
      <stop offset="40%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Ambient Golden Glow -->
    <radialGradient id="coinAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#FDE047" stop-opacity="0.55" />
      <stop offset="85%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="32" cy="32" r="31" fill="url(#coinAmbientGlow)" />

  <!-- Outer 3D Gold Rim Base -->
  <circle cx="32" cy="33" r="27" fill="#78350F" />
  <circle cx="32" cy="32" r="27" fill="url(#coinOuterRim)" stroke="#D97706" stroke-width="1.2" />

  <!-- Specular Top Rim Lip -->
  <path d="M 10 30 A 22 22 0 0 1 54 30 A 22 21 0 0 0 10 30 Z" fill="url(#coinBevelTop)" />

  <!-- Inner Stepped Gold Cavity -->
  <circle cx="32" cy="32" r="22" fill="#92400E" />
  <circle cx="32" cy="32" r="20.5" fill="url(#coinInnerFace)" stroke="#FFFBEB" stroke-width="1.2" />

  <!-- Neon Cyan Cyber Ring -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#00FFFF" stroke-width="1.2" opacity="0.9" />

  <!-- Chiseled Gold Triangular Housing -->
  <polygon points="32,18 43,38 21,38" fill="#FFFBEB" stroke="#D97706" stroke-width="0.8" />

  <!-- Solid Glowing Neon Cyan Delta Triangle Emblem -->
  <polygon points="32,20 41.5,36.5 22.5,36.5" fill="url(#neonCyanTri)" stroke="#FFFFFF" stroke-width="0.8" />

  <!-- Hot-White Core Neon Inset -->
  <polygon points="32,24 38,34.5 26,34.5" fill="#E0FFFF" opacity="0.85" />

  <!-- Micro Corner Capacitors at 3 Vertices -->
  <circle cx="32" cy="20" r="1.8" fill="#FFFFFF" />
  <circle cx="41.5" cy="36.5" r="1.8" fill="#FFFFFF" />
  <circle cx="22.5" cy="36.5" r="1.8" fill="#FFFFFF" />
</svg>
