<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="favDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241710" />
      <stop offset="100%" stop-color="#0A0604" />
    </linearGradient>
    <filter id="favGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D97706" flood-opacity="0.6" />
    </filter>
  </defs>
  
  <!-- Outer Shield Hexagon -->
  <polygon points="64,6 118,34 118,94 64,122 10,94 10,34" fill="url(#favDark)" stroke="url(#favGold)" stroke-width="4" filter="url(#favGlow)" />
  
  <!-- Inner Cyber Accent Cut -->
  <polygon points="64,18 106,42 106,86 64,110 22,86 22,42" fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.8" />

  <!-- Stylized Monogram "CR" -->
  <text x="64" y="78" font-family="'Inter', 'Arial Black', sans-serif" font-size="44" font-weight="900" font-style="italic" fill="url(#favGold)" stroke="#FFF" stroke-width="0.5" text-anchor="middle">CR</text>
  
  <!-- Bottom Cyan Core Dot -->
  <circle cx="64" cy="98" r="4" fill="#00E5FF" />
</svg>
