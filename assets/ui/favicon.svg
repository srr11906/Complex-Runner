<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="35%" stop-color="#FFB300" />
      <stop offset="70%" stop-color="#F57C00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00838F" />
    </linearGradient>

    <linearGradient id="favBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F1610" />
      <stop offset="100%" stop-color="#0D0906" />
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFB300" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Shield Badge -->
  <polygon points="16,14 112,14 98,102 64,118 30,102" fill="url(#favBg)" stroke="#D97706" stroke-width="3" />
  <polygon points="26,22 102,22 90,94 64,108 38,94" fill="none" stroke="url(#favGold)" stroke-width="1.5" opacity="0.6" />

  <!-- Iconic 'C' / Runner Crown Motif -->
  <path d="M 64 28 L 84 48 L 74 58 L 64 48 L 54 58 L 44 48 Z" fill="url(#favCyan)" />
  
  <!-- Stylized Monogram "C" for Complex -->
  <path d="M 80 62 C 76 56 68 54 64 54 C 52 54 44 63 44 75 C 44 87 52 96 64 96 C 72 96 78 92 82 86 L 72 80 C 70 84 66 86 64 86 C 58 86 54 81 54 75 C 54 69 58 64 64 64 C 68 64 70 66 72 70 Z" 
        fill="url(#favGold)" 
        filter="url(#favGlow)" />
</svg>
