<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Clean Sci-Fi Audio Muted Icon with Amber Body and Coral Cut -->
  <defs>
    <filter id="soundOffGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#EF4444" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Speaker Body (Muted tone) -->
  <polygon points="7,15 13,15 20,9 20,31 13,25 7,25" fill="#D4C2B0" />
  <!-- Mute X Slash -->
  <line x1="24" y1="14" x2="33" y2="26" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" filter="url(#soundOffGlow)" />
  <line x1="33" y1="14" x2="24" y2="26" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" filter="url(#soundOffGlow)" />
</svg>
