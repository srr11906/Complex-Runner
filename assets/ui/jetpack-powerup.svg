<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Rocket Metallic Amber Tanks -->
    <linearGradient id="rocketBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Chrome Nose Cones and Trim -->
    <linearGradient id="rocketChromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Harness Core Gradient -->
    <linearGradient id="harnessGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Plasma Flame Gradients -->
    <linearGradient id="flameOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="flameCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="jetpackAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#EF4444" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Flame Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#jetpackAura)" />

  <!-- Exhaust Plasma Flame Bursts (matching in-game jetpackFlame) -->
  <!-- Left Flame -->
  <polygon points="17,43 25,43 21,59" fill="url(#flameOuter)" />
  <polygon points="19,43 23,43 21,53" fill="url(#flameCore)" />
  <!-- Right Flame -->
  <polygon points="39,43 47,43 43,59" fill="url(#flameOuter)" />
  <polygon points="41,43 45,43 43,53" fill="url(#flameCore)" />

  <!-- Central Harness Bridge (matching in-game jetpackHarness) -->
  <rect x="23" y="21" width="18" height="15" rx="3" fill="url(#harnessGrad)" stroke="#64748B" stroke-width="1" />
  <circle cx="32" cy="28.5" r="4" fill="#00E5FF" stroke="#FFFFFF" stroke-width="0.8" />

  <!-- Left Rocket Tank -->
  <!-- Nose Cone (matching in-game jetpackCone) -->
  <path d="M 15 16 C 15 9 21 5 21 5 C 21 5 27 9 27 16 Z" fill="url(#rocketChromeGrad)" stroke="#475569" stroke-width="0.8" />
  <!-- Main Cylinder (matching in-game jetpackRocket) -->
  <rect x="15" y="16" width="12" height="23" rx="2" fill="url(#rocketBodyGrad)" stroke="#78350F" stroke-width="0.8" />
  <!-- Specular Line -->
  <line x1="17.5" y1="17" x2="17.5" y2="37" stroke="#FFFBEB" stroke-width="1" stroke-linecap="round" opacity="0.85" />
  <!-- Exhaust Nozzle (matching in-game jetpackNozzle) -->
  <polygon points="15,39 27,39 29,44 13,44" fill="url(#rocketChromeGrad)" stroke="#334155" stroke-width="0.8" />

  <!-- Right Rocket Tank -->
  <!-- Nose Cone (matching in-game jetpackCone) -->
  <path d="M 37 16 C 37 9 43 5 43 5 C 43 5 49 9 49 16 Z" fill="url(#rocketChromeGrad)" stroke="#475569" stroke-width="0.8" />
  <!-- Main Cylinder (matching in-game jetpackRocket) -->
  <rect x="37" y="16" width="12" height="23" rx="2" fill="url(#rocketBodyGrad)" stroke="#78350F" stroke-width="0.8" />
  <!-- Specular Line -->
  <line x1="39.5" y1="17" x2="39.5" y2="37" stroke="#FFFBEB" stroke-width="1" stroke-linecap="round" opacity="0.85" />
  <!-- Exhaust Nozzle (matching in-game jetpackNozzle) -->
  <polygon points="37,39 49,39 51,44 35,44" fill="url(#rocketChromeGrad)" stroke="#334155" stroke-width="0.8" />
</svg>
