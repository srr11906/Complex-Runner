<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Octagon Bevel Gradients -->
    <linearGradient id="multGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="65%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <radialGradient id="multInnerFace" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#451A03" />
    </radialGradient>

    <linearGradient id="multTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <radialGradient id="multAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#multAura)" />

  <!-- Outer Torus Ring (matching in-game multiplierRing) -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.8" />

  <!-- 3D Dropshadow -->
  <!-- 8-sided Regular Octagon vertices (radius 26): (32, 6), (50.4, 13.6), (58, 32), (50.4, 50.4), (32, 58), (13.6, 50.4), (6, 32), (13.6, 13.6) -->
  <polygon points="32,8 50,15 58,33 50,51 32,59 14,51 6,33 14,15" fill="#451A03" opacity="0.6" transform="translate(1, 1.5)" />

  <!-- 3D Outer Gold Octagon Crest (matching in-game multiplierCrest) -->
  <polygon points="32,6 50.4,13.6 58,32 50.4,50.4 32,58 13.6,50.4 6,32 13.6,13.6" fill="url(#multGoldRim)" stroke="#92400E" stroke-width="1" />

  <!-- Top Specular Highlight Edge -->
  <polygon points="32,7 49,14 47,16 32,10 17,16 15,14" fill="#FFFFFF" opacity="0.85" />

  <!-- Inner Recessed Octagon -->
  <polygon points="32,11 46.8,17.2 53,32 46.8,46.8 32,53 17.2,46.8 11,32 17.2,17.2" fill="url(#multInnerFace)" stroke="#FDE68A" stroke-width="1.2" />

  <!-- 3D 2X Text / Emblem -->
  <!-- 2 -->
  <path d="M 20 25 C 20 20, 29 19, 29 24 C 29 27, 21 34, 19 39 L 30 39 L 30 42 L 17 42 L 17 38 C 19 35, 25 28, 25 24 C 25 22, 22 22, 21 24 Z" fill="#082F49" transform="translate(1, 1)" />
  <path d="M 20 25 C 20 20, 29 19, 29 24 C 29 27, 21 34, 19 39 L 30 39 L 30 42 L 17 42 L 17 38 C 19 35, 25 28, 25 24 C 25 22, 22 22, 21 24 Z" fill="url(#multTextGrad)" stroke="#FFFFFF" stroke-width="0.8" />

  <!-- X -->
  <path d="M 33 28 L 38 35 L 43 28 L 47 28 L 41 36 L 47 44 L 43 44 L 38 37 L 33 44 L 29 44 L 35 36 L 29 28 Z" fill="#082F49" transform="translate(1, 1)" />
  <path d="M 33 28 L 38 35 L 43 28 L 47 28 L 41 36 L 47 44 L 43 44 L 38 37 L 33 44 L 29 44 L 35 36 L 29 28 Z" fill="url(#multTextGrad)" stroke="#FFFFFF" stroke-width="0.8" />
</svg>
