<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Metallic Crimson Horseshoe Gradient -->
    <linearGradient id="magRedBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="35%" stop-color="#EF4444" />
      <stop offset="70%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Chrome Pole Tip Gradient -->
    <linearGradient id="magChromeTip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="80%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Cyan Electric Arc Glow -->
    <radialGradient id="magFluxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#magFluxGlow)" />

  <!-- Magnetic Flux Waves -->
  <path d="M 18 42 C 22 52, 42 52, 46 42" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.9" />
  <path d="M 22 46 C 26 55, 38 55, 42 46" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- 3D Shadow -->
  <path d="M 14 36 L 14 26 C 14 14 22 8 32 8 C 42 8 50 14 50 26 L 50 36 L 40 36 L 40 26 C 40 21 36 17 32 17 C 28 17 24 21 24 26 L 24 36 Z" fill="#450A0A" transform="translate(1.5, 2)" opacity="0.5" />

  <!-- 3D Red Horseshoe Arch (matching in-game magnetArch) -->
  <path d="M 14 36 L 14 26 C 14 14 22 8 32 8 C 42 8 50 14 50 26 L 50 36 L 40 36 L 40 26 C 40 21 36 17 32 17 C 28 17 24 21 24 26 L 24 36 Z" fill="url(#magRedBody)" stroke="#991B1B" stroke-width="1" />

  <!-- Top Curve Specular Highlight -->
  <path d="M 16 24 C 17 16 23 10 32 10 C 41 10 47 16 48 24" fill="none" stroke="#FECACA" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- Left Pole Silver Tip (matching in-game magnetTip) -->
  <rect x="14" y="36" width="10" height="10" rx="2" fill="url(#magChromeTip)" stroke="#475569" stroke-width="1" />
  <!-- Left Pole Marking (North) -->
  <line x1="16.5" y1="41" x2="21.5" y2="41" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right Pole Silver Tip (matching in-game magnetTip) -->
  <rect x="40" y="36" width="10" height="10" rx="2" fill="url(#magChromeTip)" stroke="#475569" stroke-width="1" />
  <!-- Right Pole Marking (South) -->
  <line x1="42.5" y1="41" x2="47.5" y2="41" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round" />

  <!-- Central Electric Sparks (matching in-game magnetSpark) -->
  <circle cx="32" cy="46" r="2" fill="#FFFFFF" />
  <circle cx="27" cy="47" r="1.2" fill="#00E5FF" />
  <circle cx="37" cy="47" r="1.2" fill="#00E5FF" />
</svg>
