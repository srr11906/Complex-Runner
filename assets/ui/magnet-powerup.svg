<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="magnetOrbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F7FA" stop-opacity="1.0" />
      <stop offset="50%" stop-color="#00D2D9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#006064" stop-opacity="0.2" />
    </radialGradient>
    <linearGradient id="magnetRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="magnetBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Outer Energy Halo -->
  <circle cx="32" cy="32" r="30" fill="url(#magnetOrbGlow)" />
  <circle cx="32" cy="32" r="28" fill="rgba(10, 20, 30, 0.4)" stroke="#00D2D9" stroke-width="2.5" />

  <!-- Horseshoe Magnet Shape -->
  <path d="M 20 42 L 20 28 C 20 21 25 16 32 16 C 39 16 44 21 44 28 L 44 42 L 36 42 L 36 29 C 36 26.5 34.5 24 32 24 C 29.5 24 28 26.5 28 29 L 28 42 Z" fill="url(#magnetRed)" stroke="#7F1D1D" stroke-width="1.5" />

  <!-- Magnet Poles -->
  <rect x="20" y="36" width="8" height="6" fill="#FFFFFF" stroke="#000" stroke-width="1" />
  <rect x="36" y="36" width="8" height="6" fill="url(#magnetBlue)" stroke="#000" stroke-width="1" />
</svg>
