<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="complexGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="40%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="complexBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="complexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00E5FF" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Inverted Triangle Citadel / Mega-Structure Silhouette -->
  <!-- Floating Complex Triangle -->
  <polygon points="32,6 58,50 6,50" fill="url(#complexBase)" stroke="url(#complexGold)" stroke-width="2.5" filter="url(#complexGlow)" />
  
  <!-- Central Energy Core / Elysian Rings -->
  <polygon points="32,20 46,44 18,44" fill="none" stroke="#F59E0B" stroke-width="1.8" />
  <circle cx="32" cy="34" r="4.5" fill="#00E5FF" />
  
  <!-- Base Levitation Beams -->
  <line x1="22" y1="53" x2="22" y2="58" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="53" x2="32" y2="60" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="42" y1="53" x2="42" y2="58" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
</svg>
