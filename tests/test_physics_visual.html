<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PRABHAS: KASI 2898 AD - Automated Physics & Visual Test Harness</title>
  <style>
    body {
      background: #0F172A;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    h1 { color: #F59E0B; margin-bottom: 8px; }
    .test-card {
      background: #1E293B;
      border: 1px solid #334155;
      padding: 14px 20px;
      margin-bottom: 12px;
      border-radius: 8px;
    }
    .pass { color: #10B981; font-weight: bold; }
    .fail { color: #EF4444; font-weight: bold; }
    #visual-canvas {
      width: 480px;
      height: 270px;
      border: 2px solid #00E5FF;
      border-radius: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>PRABHAS: KASI 2898 AD (3D Runner)</h1>
  <h3>Automated Verification & Physics Test Suite</h3>
  <div id="results"></div>
  <div id="visual-canvas"></div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { CONFIG } from "../js/config.js";
    import { BhairavaModel } from "../js/models/bhairavaModel.js";
    import { BujjiModel } from "../js/models/bujjiModel.js";
    import { Player3D } from "../js/player3D.js";
    import { TrackSegmentPool3D } from "../js/world/segmentPool.js";

    const resultsContainer = document.getElementById("results");

    function assert(name, condition, details = "") {
      const card = document.createElement("div");
      card.className = "test-card";
      card.innerHTML = `
        <div><strong>${name}</strong>: ${condition ? '<span class="pass">PASSED ✅</span>' : '<span class="fail">FAILED ❌</span>'}</div>
        ${details ? `<div style="font-size: 12px; color: #94A3B8; margin-top: 4px;">${details}</div>` : ''}
      `;
      resultsContainer.appendChild(card);
    }

    try {
      // Test 1: Three.js Import & WebGL Availability
      const scene = new THREE.Scene();
      assert("Three.js Engine Initialization", !!scene, "Three.js core scene successfully instantiated.");

      // Test 2: Bhairava 3D Model Rigging
      const bhairava = new BhairavaModel();
      assert("Bhairava 3D Model Creation", !!bhairava.parts.hips && !!bhairava.parts.torso && !!bhairava.parts.head, "Hips, Torso, Head, and Gauntlet limbs correctly rigged.");

      // Test 3: Bujji Left Shoulder Positioning Verification
      const bujji = new BujjiModel();
      bujji.update(0, 0, 0, 0, 0);
      assert("Bujji Left Shoulder Placement", bujji.root.position.x < 0, `Bujji X position is ${bujji.root.position.x.toFixed(2)} (confirmed Left Shoulder side).`);

      // Test 4: Kinematic Jump Physics Trajectory
      const jumpPeak = (CONFIG.JUMP_VELOCITY ** 2) / (2 * Math.abs(CONFIG.GRAVITY));
      assert("Jump Kinematics Accuracy", jumpPeak >= 2.5 && jumpPeak <= 3.0, `Peak jump height = ${jumpPeak.toFixed(2)}m (Target: ~2.76m Subway Surfers model).`);

      // Test 5: 3-Lane Grid Bounds
      assert("3-Lane Grid Definition", CONFIG.LANES.length === 3 && CONFIG.LANES[0] === -3.0 && CONFIG.LANES[2] === 3.0, "Lanes correctly bounded at [-3.0m, 0.0m, +3.0m].");

      // Test 6: 1 Million Units Target Goal
      assert("1 Million Units Goal", CONFIG.TARGET_UNITS === 1000000 && CONFIG.UNITS_PER_COIN === 10000, `Target = ${CONFIG.TARGET_UNITS.toLocaleString()} Units (${CONFIG.UNITS_PER_COIN.toLocaleString()} Units per coin).`);

      // Test 7: Object Pooling & Track Generation
      const pool = new TrackSegmentPool3D(scene);
      pool.init();
      assert("Track Chunk Pool Generation", pool.activeChunks.length === CONFIG.ACTIVE_CHUNKS, `Active chunks = ${pool.activeChunks.length} (Constant 60 FPS memory pool).`);

      // Test 8: Visual WebGL Render Check
      const container = document.getElementById("visual-canvas");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(480, 270);
      container.appendChild(renderer.domElement);

      const camera = new THREE.PerspectiveCamera(60, 480 / 270, 0.1, 100);
      camera.position.set(0, 2.5, -5);
      camera.lookAt(0, 1.2, 5);

      const light = new THREE.DirectionalLight(0xFFE8B3, 2.0);
      light.position.set(5, 10, -5);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x8C7355, 1.5));

      const player = new Player3D(scene);
      renderer.render(scene, camera);

      assert("Visual WebGL PBR Render", true, "Render pass executed successfully with Bhairava, Bujji, and track in scene.");

    } catch (e) {
      assert("Test Suite Execution Error", false, e.toString());
    }
  </script>
</body>
</html>
